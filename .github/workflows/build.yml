name: Build Flutter

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==========================================
  # ANDROID
  # ==========================================

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ProcuraPalavras.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProcuraPalavras-Android
          path: build/app/outputs/flutter-apk/ProcuraPalavras.apk

  # ==========================================
  # WEB
  # ==========================================

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /ProcuraPalavras/

      # ------------------------------------------
      # UPLOAD PARA GITHUB PAGES
      # ------------------------------------------

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ==========================================
  # DEPLOY GITHUB PAGES
  # ==========================================

  deploy:
    runs-on: ubuntu-latest

    needs:
      - web

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # RELEASE
  # ==========================================

  release:
    runs-on: ubuntu-latest

    needs:
      - android

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ProcuraPalavras-Android
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ProcuraPalavras v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/ProcuraPalavras.apk
